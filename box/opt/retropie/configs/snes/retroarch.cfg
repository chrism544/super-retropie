run_ahead_enabled = "true"
run_ahead_frames = "1"
run_ahead_secondary_instance = "true"
run_ahead_hide_warnings = "true"
# Settings made here will only override settings in the global retroarch.cfg if placed above the #include line

input_remapping_directory = "/opt/retropie/configs/snes"

# bezel (console artwork for games without their own) - RetroPie menu > Game Artwork
input_overlay_hide_in_menu = "true"
aspect_ratio_index = "0"
input_overlay = "/opt/retropie/configs/all/retroarch/overlay/SystemBezels/snes.cfg"
input_overlay_enable = "true"
input_overlay_opacity = "0.500000"
rewind_enable = "true"
rewind_buffer_size = "40"
rewind_granularity = "1"
#include "/opt/retropie/configs/all/retroarch.cfg"
