# Per-game Xbox picture settings (xemu surface_scale + renderer).
# Since 19 Oct 2026 every game uses 1 opengl by default (original Xbox resolution, smoothest on this PC),
# set in ~/.local/share/xemu/xemu/xemu.toml. Add a line here to make one game sharper, e.g.  Halo = 2 vulkan
# Format: <part of the game file name> = <1|2|3> [opengl|vulkan]
From Russia with Love = 1 opengl
Area 51 (Europe) (En,Fr,De,Es,It) = 1 opengl
Prince of Persia - The Sands of Time = 1 opengl
