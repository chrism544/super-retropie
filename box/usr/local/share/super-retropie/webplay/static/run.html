<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Super RetroPie</title>
<style>
@font-face { font-family: Roboto; src: url(/play/theme/font.ttf) format("truetype"); font-weight: 500; }
html, body { margin: 0; height: 100%; background: #000; color: #f7f7f7; overflow: hidden; font: 500 15px Roboto, system-ui, sans-serif; }
#game { position: fixed; inset: 0; }
#bar { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 10px; align-items: center; transition: opacity .3s; }
#bar.idle { opacity: 0; pointer-events: none; }
#bar button { padding: 8px 16px; border-radius: 99px; border: 2px solid #cfeeff; color: #fff; font: inherit; cursor: pointer;
  text-transform: uppercase; background: linear-gradient(#e9f6ff 0, #7fb9dc 18%, #2f7fb0 50%, #1c6a99 70%, #7fdcff 100%); }
#sync { padding: 6px 12px; border-radius: 99px; background: #0e1620cc; border: 1px solid #116a9d; font-size: 13px; }
#sync:empty { display: none; }
#err { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; z-index: 20; background: #000; }
#err[hidden] { display: none; }
#wake { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; text-align: center; cursor: pointer;
  background: radial-gradient(#0b2233cc, #000000ee); }
#wake[hidden] { display: none; }
#wake b { display: inline-block; padding: 14px 40px; border-radius: 99px; border: 2px solid #cfeeff; color: #fff; font-size: 20px;
  text-transform: uppercase; background: linear-gradient(#e9f6ff 0, #7fb9dc 18%, #2f7fb0 50%, #1c6a99 70%, #7fdcff 100%); }
#wake p { color: #96a5b4; margin-top: 16px; }
</style>
</head>
<body>
<div id="bar"><button id="menu" title="Back to the game menu (saves first)">◀ Menu</button><span id="sync" role="status"></span></div>
<div id="game"></div>
<div id="err" hidden></div>
<div id="wake" hidden><div><b>Press any key or click to start</b><p>Browsers wait for a key or click before a game can make sound.<br>After that your game pad works as normal.</p></div></div>
<script src="/play/static/run.js?v=3"></script>
</body>
</html>
